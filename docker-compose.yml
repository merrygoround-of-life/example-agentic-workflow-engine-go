version: '3.8'

services:
  agentic-workflow-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agentic-workflow-engine
    ports:
      - "8080:8080"
    environment:
      # Set your API keys here or use .env file
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/echo"]
      timeout: 10s
      interval: 30s
      retries: 3
      start_period: 40s